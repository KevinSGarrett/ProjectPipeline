[package]
name = "project-pipeline-command-center"
version = "0.10.0"
description = "Project Pipeline Command Center desktop shell"
authors = ["Kevin Garrett"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
