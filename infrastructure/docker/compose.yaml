services:
  command-center:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        PROJECT_PIPELINE_BASE_IMAGE: ${PROJECT_PIPELINE_BASE_IMAGE:?immutable base image digest reference required}
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      PROJECT_PIPELINE_COMMAND_CENTER_TOKEN: ${PROJECT_PIPELINE_COMMAND_CENTER_TOKEN:?runtime token reference required}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
