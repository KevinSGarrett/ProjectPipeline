[build-system]
requires = ["setuptools>=83,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "project-pipeline"
version = "0.9.0"
description = "Traceable, policy-safe autonomous project-control foundation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Kevin Garrett"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["automation", "orchestration", "project-control", "traceability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "networkx>=3.6,<4",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]
database = [
  "alembic>=1.16,<2",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]
otlp = [
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
]
optimizer = [
  "ortools>=9.15,<10",
]
advisory-agent = [
  "pydantic-ai-slim>=2.31,<3",
]
ai-observability = [
  "openlit>=1.45,<2",
]
context-lightweight = [
  "markitdown>=0.1.7,<0.2",
]
context-structured = [
  "docling-slim>=2.120.1,<3",
]
orchestration-hatchet = [
  "hatchet-sdk>=1.37.2,<2",
]
verification-browser = [
  "playwright>=1.57,<2",
]
notifications = [
  "apprise>=1.9,<2",
]

[dependency-groups]
test = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]
quality = [
  "build==1.5.0",
  "mypy==2.3.0",
  "numpy==2.3.5",
  "pip-audit==2.10.1",
  "pre-commit==4.6.0",
  "ruff==0.16.3",
  "types-networkx==3.6.1.20260728",
]

[project.scripts]
project-pipeline = "project_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_pipeline = ["py.typed", "upstream_data/*.json"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["plans/_line_numbered", "third_party"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
files = [
  "src/project_pipeline/agent_router",
  "src/project_pipeline/configuration",
  "src/project_pipeline/contracts",
  "src/project_pipeline/core",
  "src/project_pipeline/control",
  "src/project_pipeline/dependencies.py",
  "src/project_pipeline/domain",
  "src/project_pipeline/infra",
  "src/project_pipeline/intake",
  "src/project_pipeline/jira_steward",
  "src/project_pipeline/persistence",
  "src/project_pipeline/services",
  "src/project_pipeline/observability",
  "src/project_pipeline/orchestration",
  "src/project_pipeline/quality.py",
  "src/project_pipeline/runtime",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
branch = true
source = ["project_pipeline"]
omit = ["src/project_pipeline/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 70
exclude_also = [
  "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"
