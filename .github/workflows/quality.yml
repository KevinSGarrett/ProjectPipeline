name: Repository quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }} verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned runtime and verification dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==84.0.0
          python -m pip install -r requirements/runtime.txt
          python -m pip install -r requirements/development.txt
          python -m pip install -r requirements/quality-tools.txt
          python -m pip install --no-deps -e .
      - name: Check generated schemas and dependency state
        run: |
          project-pipeline schemas check --root .
          project-pipeline dependencies validate --root .
      - name: Validate checkout mode and cold start
        run: |
          python scripts/validate_instructions.py --root .
          python scripts/instruction_cold_start.py --root .
      - name: Repository self-validation
        run: |
          project-pipeline validate --root .
          python scripts/validate_public_repository.py --root .
      - name: Enforce cohesive delivery progress
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11'
        run: >-
          project-pipeline assurance delivery-gate --root .
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --head-ref "${{ github.event.pull_request.head.sha }}"
      - name: Lint and formatting check
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Static typing
        run: mypy
      - name: Tests and coverage
        run: pytest -q --cov=project_pipeline --cov-report=term-missing --cov-fail-under=60
      - name: Build distributions
        run: python -m build

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install audit inputs
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==84.0.0
          python -m pip install -r requirements/runtime.txt
          python -m pip install pip-audit==2.10.1
      - name: Audit active runtime dependency set
        run: pip-audit --local --format json --output dependency-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
