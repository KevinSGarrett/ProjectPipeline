name: Native desktop Windows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DATE_EPOCH: "1722470400"
  CARGO_TERM_COLOR: never
  RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"
  PYTHONUTF8: "1"

jobs:
  build:
    name: Hosted Windows desktop ${{ matrix.lane }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e85afbd5cb62109ae0 # v4.4.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: apps/command_center/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pinned Rust 1.97.1
        run: |
          Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain 1.97.1 --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-msvc
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.cargo\bin"
      - name: Record identity and toolchain
        run: |
          git rev-parse HEAD
          git rev-parse "HEAD^{tree}"
          rustc --version
          cargo --version
          node --version
          npm --version
      - name: Install JavaScript dependencies from lockfile
        working-directory: apps/command_center
        run: npm ci
      - name: JavaScript tests and production build
        working-directory: apps/command_center
        run: |
          npm test
          npm run build
      - name: Rust format, lint, and tests
        working-directory: apps/desktop_shell/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo test --locked
      - name: Build native Windows executable and installers
        working-directory: apps/command_center
        run: npm run tauri:build -- -- --locked
      - name: Hash and stage artifacts
        run: >
          python -B scripts/stage_desktop_artifacts.py
          --release-dir apps/desktop_shell/src-tauri/target/release
          --output-dir desktop-artifacts
          --lane "${{ matrix.lane }}"
          --head "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows-${{ matrix.lane }}
          path: desktop-artifacts
          if-no-files-found: error

  compare:
    name: Compare normalized desktop lanes
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-windows-A
          path: desktop-lanes/A
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-windows-B
          path: desktop-lanes/B
      - name: Compare normalized payload trees
        run: |
          $env:PYTHONPATH = "src"
          python -B scripts/compare_desktop_artifacts.py --root . --left desktop-lanes/A --right desktop-lanes/B --json-output desktop-lanes/compare.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-windows-compare
          path: desktop-lanes/compare.json
          if-no-files-found: warn
