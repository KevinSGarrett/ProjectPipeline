name: Bug report
description: Report a reproducible problem in ProjectPipeline
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ProjectPipeline. Search existing issues first and remove credentials, private project data, and sensitive logs before submitting.
  - type: input
    id: version
    attributes:
      label: ProjectPipeline version
      description: Provide a release version or commit SHA.
      placeholder: "0.9.0 or 8b307c2"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.13.5"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened? Include the exact error text when safe.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest reliable sequence of commands or actions that reproduces the problem.
      placeholder: |
        1. Install ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs, configuration details, screenshots, or related links.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and discussions for this problem.
          required: true
        - label: I removed credentials, private data, and other sensitive information.
          required: true
        - label: This is not a security vulnerability.
          required: true
